name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    name: Offline checks
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install small dependency sets
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-hosted.txt

      - name: Run pre-commit
        shell: pwsh
        run: pre-commit run --all-files

      - name: Run focused offline tests
        shell: pwsh
        run: python -m pytest -q

  answer-pdf:
    name: Answer PDF
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install PDF renderer and test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-core fonts-noto-mono
          python -m pip install -r requirements-hosted.txt -r requirements-dev.txt -r requirements-pdf.txt
      - name: Verify PDF bytes
        run: |
          python -c "from scryraven.answer_pdf import available; assert available()"
          python -m pytest tests/test_answer_pdf.py -q
