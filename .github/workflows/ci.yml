name: CI

on:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: "Validation scope to run"
        required: true
        default: fast_pr
        type: choice
        options:
          - docs_only
          - fast_pr
          - author_lane
          - full
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  offline-checks:
    name: Offline checks
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      VALIDATION_SCOPE: ${{ github.event.inputs.validation_scope || '' }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit pytest

          if (Test-Path requirements-dev.txt) {
            python -m pip install -r requirements-dev.txt
          }

          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }

          if (Test-Path pyproject.toml) {
            python -m pip install -e .
          }

      - name: Select validation bucket
        id: select-validation
        shell: pwsh
        run: |
          function Test-DocsOnlyChange {
            param([string[]]$Paths)

            if (-not $Paths -or $Paths.Count -eq 0) {
              return $false
            }

            $codeOrWorkflowRoots = @(
              ".github/",
              "core/",
              "proplex/",
              "scripts/",
              "tests/"
            )
            $codeOrWorkflowFiles = @(
              ".pre-commit-config.yaml",
              "pytest.ini",
              "ruff.toml",
              "pyproject.toml",
              "requirements.txt",
              "requirements-dev.txt"
            )

            foreach ($path in $Paths) {
              $normalized = $path -replace "\\", "/"
              $extension = [System.IO.Path]::GetExtension($normalized).ToLowerInvariant()
              $isDocsText = $extension -in @(".md", ".txt")
              $isDocsPath = (
                $normalized.StartsWith("docs/") -or
                $normalized.StartsWith("runbooks/") -or
                $normalized.StartsWith("prompts/") -or
                $normalized -eq "AGENTS.md" -or
                $normalized -eq "README.md"
              )

              foreach ($root in $codeOrWorkflowRoots) {
                if ($normalized.StartsWith($root)) {
                  return $false
                }
              }
              if ($codeOrWorkflowFiles -contains $normalized) {
                return $false
              }
              if (-not ($isDocsPath -and $isDocsText)) {
                return $false
              }
            }

            return $true
          }

          $bucket = $env:VALIDATION_SCOPE
          if (-not $bucket) {
            if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF -eq "refs/heads/main") {
              $bucket = "full"
            } elseif ($env:GITHUB_EVENT_NAME -eq "pull_request") {
              $changed = @(git diff --name-only $env:PR_BASE_SHA $env:PR_HEAD_SHA)
              if (Test-DocsOnlyChange -Paths $changed) {
                $bucket = "docs_only"
              } else {
                $bucket = "fast_pr"
              }
              Write-Host "Changed files:"
              $changed | ForEach-Object { Write-Host "  $_" }
            } else {
              $bucket = "fast_pr"
            }
          }

          if ($bucket -notin @("docs_only", "fast_pr", "author_lane", "full")) {
            throw "Unknown validation bucket: $bucket"
          }

          Write-Host "Selected validation bucket: $bucket"
          "bucket=$bucket" >> $env:GITHUB_OUTPUT

      - name: Run pre-commit
        env:
          VALIDATION_BUCKET: ${{ steps.select-validation.outputs.bucket }}
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            pre-commit run --from-ref $env:PR_BASE_SHA --to-ref $env:PR_HEAD_SHA
          } else {
            pre-commit run --all-files
          }

      - name: Run offline pytest
        env:
          VALIDATION_BUCKET: ${{ steps.select-validation.outputs.bucket }}
        shell: pwsh
        run: |
          switch ($env:VALIDATION_BUCKET) {
            "docs_only" {
              Write-Host "docs_only selected; skipping pytest by default."
            }
            "fast_pr" {
              python scripts/validation/run_bucket.py fast_pr
            }
            "author_lane" {
              python scripts/validation/run_bucket.py author_lane
            }
            "full" {
              python scripts/validation/run_bucket.py full
            }
            default {
              throw "Unknown validation bucket: $env:VALIDATION_BUCKET"
            }
          }
