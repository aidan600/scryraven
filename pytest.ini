[pytest]
markers =
    integration: calls external APIs; run with -m integration when keys are set
testpaths =
    tests
norecursedirs =
    .git
    .hg
    .svn
    .tox
    .pytest_cache
    .venv
    env
    venv
    build
    dist
    output
    outputs
    local_output
    local_outputs
    local_review
    cache
    caches
    logs
    private_logs
    secrets
addopts =
    -m "not integration"
